name: Windows baseline, 0.159 combination and historical patch applicability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-159-source:
    name: Frozen 0.159.2 source, four patches and scripts (no Rust build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the frozen source from the shared metadata
        run: |
          $baseline = Get-Content -Raw config/engine-baseline.json | ConvertFrom-Json
          git init upstream
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C upstream remote add origin https://github.com/openai/codex.git
          if ($LASTEXITCODE -ne 0) { throw 'remote add failed' }
          git -C upstream fetch --depth 1 origin $baseline.sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          git -c core.autocrlf=false -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
      - name: Verify release pins and installer rejection conditions without compiling
        run: |
          $env:CODEX_TEST_UPSTREAM_CHECKOUT = Join-Path $env:GITHUB_WORKSPACE 'upstream'
          node --test --test-concurrency=1 tools/engine-baseline.test.mjs tools/binding-patches.test.mjs tools/proxy-transforms.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'lightweight tests failed' }
      - name: Check and apply all four 0.159 patches in shared order (no Rust)
        run: node tools/binding-patches.mjs --engine (Join-Path $env:GITHUB_WORKSPACE 'upstream') --combined --apply
      - name: Check PowerShell and JavaScript syntax
        run: ./tools/check-scripts.ps1

  historical-154-patch-applies:
    name: Historical 0.154 patch applicability only
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PIN_SHA: 1715e55076737158ba61d43158ede504de6d4ce1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the historical source and require its expected tree
        run: |
          set -euo pipefail
          grep -q "$PIN_SHA" README.md
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          git -C upstream fetch --depth 1 origin "$PIN_SHA"
          git -c core.autocrlf=false -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$PIN_SHA"
          test -f upstream/codex-rs/Cargo.toml
          test -f upstream/codex-rs/core/src/config/mod.rs
      - name: Check and apply the historical patch
        run: |
          set -euo pipefail
          git -C upstream apply --check "$GITHUB_WORKSPACE/patch/model-provider-routes.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patch/model-provider-routes.patch"
          changed="$(git -C upstream status --porcelain | wc -l)"
          test "$changed" -ge 10

  historical-158-binding-patches-apply:
    name: Historical 0.158 combination applicability only (not 0.159)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PIN_SHA: 064c6b8c737f5b41d171fdda80bd9ef10ad06eb3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the historical source and apply the four patches in order
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          git -C upstream fetch --depth 1 origin "$PIN_SHA"
          git -c core.autocrlf=false -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$PIN_SHA"
          test -f upstream/codex-rs/Cargo.toml
          git -C upstream apply --check "$GITHUB_WORKSPACE/patch/model-provider-routes-0.158.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patch/model-provider-routes-0.158.patch"
          git -C upstream apply --check "$GITHUB_WORKSPACE/patch/fork-provider-binding-0.158.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patch/fork-provider-binding-0.158.patch"
          git -C upstream apply --check "$GITHUB_WORKSPACE/patch/subagent-provider-binding-0.158.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patch/subagent-provider-binding-0.158.patch"
          git -C upstream apply --check "$GITHUB_WORKSPACE/patch/parent-completion.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patch/parent-completion.patch"

name: 0.159 Windows combination (manual heavy validation)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the frozen source from shared metadata
        run: |
          $baseline = Get-Content -Raw config/engine-baseline.json | ConvertFrom-Json
          git init upstream
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C upstream remote add origin https://github.com/openai/codex.git
          if ($LASTEXITCODE -ne 0) { throw 'remote add failed' }
          git -C upstream fetch --depth 1 origin $baseline.sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          git -c core.autocrlf=false -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/codex-rs -> target
          shared-key: combination-159-windows-debug
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Install the default four-patch debug CLI once
        run: ./tools/install-engine.ps1 -EnginePath (Join-Path $env:GITHUB_WORKSPACE 'upstream')
      - name: Focused core binding and parent delivery tests
        working-directory: upstream
        run: >-
          just test -p codex-core --lib --test-threads=1
          -E 'test(spawn_agent_) | test(multi_agent_v2_completion_) | test(multi_agent_v2_detached_) | test(multi_agent_v2_interrupted_) | test(completion_keeps_mail_queued_) | test(residency_keeps_nested_)'
      - name: Parent completion through the public app-server seam
        working-directory: upstream
        run: just test -p codex-app-server --test all --test-threads=1 -E 'test(parent_completion_wake)'
      - name: Public routing, initialize and GLM mock behavior
        env:
          CODEX_TEST_ROUTED_BINARY: ${{ github.workspace }}/upstream/codex-rs/target/debug/codex.exe
        run: node --test tools/model-routing.test.mjs tools/engine-initialize.test.mjs tools/glm-responses.test.mjs
      # Published SDK pins and their acceptance remain with #32/#33; reuse this CLI there.
